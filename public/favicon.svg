<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Obsidian Blue Gradients for Ribbon 'T' -->
    <linearGradient id="obsidianTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3F5A" />
      <stop offset="100%" stop-color="#1C2B3F" />
    </linearGradient>
    <linearGradient id="obsidianStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2B3F" />
      <stop offset="100%" stop-color="#131E2C" />
    </linearGradient>
    <linearGradient id="obsidianFold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#354E6E" />
      <stop offset="100%" stop-color="#1C2B3F" />
    </linearGradient>

    <!-- Arctic Teal Gradients for Arrow 'V' -->
    <linearGradient id="tealArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#168F88" />
      <stop offset="50%" stop-color="#20B2AA" />
      <stop offset="100%" stop-color="#3FE0D7" />
    </linearGradient>
    <linearGradient id="tealFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12736D" />
      <stop offset="100%" stop-color="#20B2AA" />
    </linearGradient>
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#20B2AA" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Soft Sand Squircle Background with Arctic Teal Border for Universal Contrast in All Browser Tabs -->
  <rect width="120" height="120" rx="28" fill="#FCF9EE" stroke="#20B2AA" stroke-width="2.5" />

  <!-- 1. Left 'T' Ribbon Top Bar -->
  <path d="M24 22 H74 L60 40 H10 L24 22Z" fill="url(#obsidianTop)" />

  <!-- 2. Top-Right Fold of 'T' -->
  <path d="M74 22 L86 38 L68 46 L60 40 L74 22Z" fill="url(#obsidianFold)" />

  <!-- 3. Stem of 'T' Ribbon -->
  <path d="M60 40 L38 72 H20 L44 38 L60 40Z" fill="url(#obsidianStem)" />

  <!-- 4. Bottom Horizontal Base of 'T' -->
  <path d="M20 72 H52 L42 88 H10 L20 72Z" fill="url(#obsidianTop)" />

  <!-- 5. Central Fold connector to 'V' -->
  <path d="M42 88 L64 54 L76 68 L54 100 L42 88Z" fill="url(#tealFold)" />

  <!-- 6. Rising Arctic Teal Arrow forming 'V' -->
  <path d="M54 100 L96 42 L80 42 L106 14 L114 48 L98 48 L64 96 Z" fill="url(#tealArrow)" filter="url(#tealGlow)" />
  
  <!-- Crisp Geometric Arrowhead for 'V' -->
  <polygon points="106,12 118,44 102,40 88,60 76,46 94,36" fill="#20B2AA" />
</svg>